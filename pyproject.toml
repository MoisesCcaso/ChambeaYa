[project]
name = "chambeaya"
version = "1.0.0"
description = "Plataforma web para la gestion de practicas preprofesionales"
authors = [
    {name = "JLtz00",email = "lorenzoltx@gmail.com"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "flask (>=3.0,<4.0)",
    "flask-sqlalchemy (>=3.1,<4.0)",
    "flask-migrate (>=4.0,<5.0)",
    "python-dotenv (>=1.0,<2.0)",
    "reportlab (>=4.0,<5.0)",
    "qrcode (>=7.0,<9.0)",
    "flask-wtf (>=1.2,<2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=8.3,<9.0)",
    "pytest-cov (>=6.0,<7.0)",
    "ruff (>=0.8,<0.9)",
    "selenium (>=4.27,<5.0)",
    "pytest-html (>=4.1,<5.0)"
]

[tool.poetry]
packages = [
    { include = "client", from = "src/main" },           # client (views): HTML/CSS/JS that consume the REST API
    { include = "bootstrap", from = "src/main" },        # composition root: REST API app, wiring, migrations
    { include = "shared", from = "src/main" },           # shared kernel: database, mixins, messages
    { include = "notifications", from = "src/main" },    # bounded context: notifications
    { include = "identity", from = "src/main" },         # bounded context: identity and access
    { include = "profiles", from = "src/main" },         # bounded context: intern and company profiles
    { include = "recruitment", from = "src/main" },      # bounded context: job postings and applications
    { include = "matching", from = "src/main" },         # bounded context: skill-based suggestions
    { include = "internships", from = "src/main" },      # bounded context: internships, deliverables, evaluations
    { include = "certification", from = "src/main" },    # bounded context: digital certificates
    { include = "config.py", from = "src/main" },
    { include = "run.py", from = "src/main" },
]
include = [
    { path = "src/main/client/templates/**/*", format = ["sdist", "wheel"] },
    { path = "src/main/client/static/**/*", format = ["sdist", "wheel"] },
    { path = "src/main/bootstrap/migrations/**/*", format = ["sdist", "wheel"] },
]
exclude = ["**/__pycache__/**", "**/*.pyc"]

[project.scripts]
chambeaya = "run:main"
chambeaya-client = "client.run:main"

[tool.pytest.ini_options]
testpaths = ["src/test"]
pythonpath = ["src/main"]
python_files = ["test_*.py"]
addopts = "-v"

[tool.coverage.run]
source = ["client", "bootstrap", "shared", "identity", "profiles", "recruitment", "matching", "internships", "certification", "notifications"]
omit = ["src/main/bootstrap/migrations/*", "*/__pycache__/*"]

[tool.coverage.xml]
output = "reports/coverage.xml"

[tool.coverage.html]
directory = "reports/htmlcov"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["src/main/bootstrap/migrations", ".venv"]
