<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <meta name="theme-color" content="#0062fc">
    <title>{% block title %}ChambeaYa{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/chambeaYa_icon.ico') }}">
    <link rel="shortcut icon" href="{{ url_for('static', filename='img/chambeaYa_icon.ico') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='img/chambeaya-logo-square.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
    {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    {% block body %}{% endblock %}
    <div class="toast-region" id="toast-region" aria-live="polite"></div>
    {% block scripts %}{% endblock %}
</body>
</html>
