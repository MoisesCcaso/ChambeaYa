sonar.projectKey=chambeaya
sonar.projectName=ChambeaYa
sonar.host.url=http://localhost:9000

sonar.sources=src/main
sonar.tests=src/test
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# coverage generada por: pytest --cov --cov-report=xml
sonar.python.coverage.reportPaths=reports/coverage.xml

sonar.exclusions=src/main/bootstrap/migrations/**,**/__pycache__/**,.venv/**,reports/**
# sin tests de JS: el static contaria como 0% y hundiria la cobertura global
sonar.coverage.exclusions=src/main/bootstrap/static/**,src/main/config.py,src/main/run.py
